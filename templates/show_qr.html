<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #f2f2f2;
        }

        .container {
            width: min(100%, 450px);
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 25px;
        }

        img {
            width: min(100%, 300px);
            height: auto;
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Your QR Code</h1> <img src="data:image/png;base64,{{ qr_image }}" alt="Generated QR Code">
    </div>
</body>

</html>
